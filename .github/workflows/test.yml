---
name: Tests

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 \
            xvfb xauth dbus-x11 openbox x11-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --cache-dir .cache/bun

      - name: Prepare Electrobun SDK
        run: bun run prepare:sdk

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build native development app
        env:
          MCP_GATEWAY_BUILD_ROOT: build/linux-native-ci
        run: bun run build

      - name: Native WebKitGTK smoke with owned display and window manager
        run: bash scripts/check-native-linux.sh build/linux-native-ci/dev-linux-x64/MCPGateway-dev
